boundary_mappings:
- id: cloudflare-wire-to-provider-identity
  interaction: Map a cryptographically verified Cloudflare token and token-bound full identity response into a preapproved provider identity.
  producer: access_domain
  consumer: identity_registry
  parent: access_domain
  producer_contract: null
  consumer_contract: provideridentity
  mapping_owner: access_domain
  state_objects: []
  allowed_edges: [access_domain->identity_registry]
  forbidden_edges: [identity_registry->access_domain, identity_registry->cloudflare_identity_adapter]
- id: principal-to-session-profile
  interaction: Map an enabled provider identity and internal account snapshot into a bounded role-safe application session profile.
  producer: identity_registry
  consumer: session_management
  parent: access_domain
  producer_contract: provideridentity
  consumer_contract: sessionprofile
  mapping_owner: access_domain
  state_objects: []
  allowed_edges: []
  forbidden_edges: [identity_registry->session_management, session_management->identity_registry]
- id: session-to-rls-context
  interaction: Convert a validated application session into transaction-local PostgreSQL RLS context without exposing SQL handles.
  producer: access_domain
  consumer: session_management
  parent: access_domain
  producer_contract: securitycontext
  consumer_contract: sessionprofile
  mapping_owner: access_domain
  state_objects: []
  allowed_edges: [access_domain->session_management]
  forbidden_edges: [session_management->access_domain, session_management->postgres_access_adapter]
- id: account-intent-to-confirmed-change
  interaction: Map an exact versioned account mutation intent into a single-use confirmation and resume the mutation only after atomic validation.
  producer: account_administration
  consumer: confirmation_challenge
  parent: access_domain
  producer_contract: accountsummary
  consumer_contract: confirmationchallenge
  mapping_owner: access_domain
  state_objects: []
  allowed_edges: []
  forbidden_edges: [account_administration->confirmation_challenge, confirmation_challenge->account_administration]
- id: access-response-to-react-view
  interaction: Deliver server-authoritative role-discriminated Access projections to responsive React routes through generated transport contracts.
  producer: thesis_trace_application
  consumer: access_domain
  parent: thesis_trace_application
  producer_contract: null
  consumer_contract: null
  mapping_owner: thesis_trace_application
  state_objects: []
  allowed_edges: [thesis_trace_application->access_domain]
  forbidden_edges: [access_domain->thesis_trace_application]
flows:
- id: production_database_migration
  owner: backend_composition
  description: Apply forward-only schema changes and least-privilege runtime grants before API or collector startup.
  trigger: {kind: condition, ref: deployment_migration_started, description: Compose starts the one-shot migration process after PostgreSQL readiness.}
  steps:
  - {id: production_database_migration.apply, order: 1, module: postgres_migration_entrypoint, action: Connect with the migration-owner credential apply checksummed forward migrations then grant API and collector runtime privileges., receives: [], emits: [platform.migration_failed], state_changes: [Database schema version and role grants advance atomically or startup stops.], side_effects: [PostgreSQL DDL and grants under the one-shot migration role.]}
  success:
    result: Runtime services may start against the migrated schema using non-owner credentials.
    events: []
  errors:
  - condition: Credential resolution migration checksum DDL or grant application fails.
    event: platform.migration_failed
    handling: Exit nonzero and keep dependent runtime services stopped.
- id: access_session_bootstrap
  owner: thesis_trace_application
  description: Verify full Cloudflare identity, resolve a preapproved user, establish a bounded session, and return a role-safe profile.
  trigger: {kind: command, ref: access.bootstrap_session, description: A protected request presents an Access JWT and get-identity evidence.}
  steps:
  - {id: access_session_bootstrap.verify, order: 1, module: access_domain, action: Verify signature issuer audience expiry MFA subject and idp.id/type without trusting email as identity., receives: [access.identity_provider], emits: [], state_changes: [], side_effects: [Cloudflare key and get-identity access through the adapter.]}
  - {id: access_session_bootstrap.resolve, order: 2, module: access_domain, action: Resolve exactly one enabled preapproved ProviderIdentityMapping., receives: [access.resolve_identity], emits: [access.identity_resolved, access.identity_rejected], state_changes: [], side_effects: [Read account mapping through Access repository.]}
  - {id: access_session_bootstrap.establish, order: 3, module: access_domain, action: Commit a normal or recovery-bounded application session and role-filtered profile., receives: [access.bootstrap_session], emits: [access.session_established, access.recovery_session_detected], state_changes: [AccessSession is created or refreshed within the verified token expiry.], side_effects: [Persist session and immutable recovery audit when applicable.]}
  - {id: access_session_bootstrap.present, order: 4, module: thesis_trace_application, action: Return only the exact Owner Learner or Admin profile variant and route capabilities., receives: [access.session_established], emits: [], state_changes: [], side_effects: [Generated HTTPS response; browser stores no JWT or domain data persistently.]}
  success:
    result: A verified identity receives one bounded role-safe session profile.
    events: [access.identity_resolved, access.session_established]
  errors:
  - condition: JWT, full identity, provider mapping, MFA, or session binding is invalid.
    event: access.identity_rejected
    handling: Return uniform access_denied and persist no usable session.
- id: confirmed_account_change
  owner: thesis_trace_application
  description: Preview and atomically confirm one consequential identity, role, or account lifecycle change.
  trigger: {kind: command, ref: access.preview_consequential_action, description: An authorized Admin submits an exact target version and payload for preview.}
  steps:
  - {id: confirmed_account_change.preview, order: 1, module: access_domain, action: Reauthorize actor and target then generate structured before-after impact., receives: [access.preview_consequential_action], emits: [access.confirmation_issued], state_changes: [ConfirmationChallenge becomes available for at most five minutes.], side_effects: [Persist challenge digest and bindings without logging token.]}
  - {id: confirmed_account_change.present, order: 2, module: thesis_trace_application, action: Present explicit action summary and require a nonblank reason while retaining token only in volatile dialog state., receives: [access.confirmation_issued], emits: [], state_changes: [], side_effects: [Responsive modal or full-screen mobile dialog.]}
  - {id: confirmed_account_change.confirm, order: 3, module: access_domain, action: Revalidate actor action version payload digest token expiry and reason., receives: [access.confirm_consequential_action], emits: [], state_changes: [], side_effects: [Reject mismatch expiry reuse and concurrent changes with a fresh-preview requirement.]}
  - {id: confirmed_account_change.commit, order: 4, module: access_domain, action: Atomically consume challenge mutate account append audit and revoke affected sessions., receives: [access.confirm_consequential_action, access.manage_accounts], emits: [access.confirmation_consumed, access.account_changed, access.session_revoked], state_changes: [Challenge is consumed and account version advances.], side_effects: [One PostgreSQL transaction under server-derived RLS context.]}
  success:
    result: The exact account mutation, challenge consumption, reason, session revocation, and audit commit once.
    events: [access.confirmation_issued, access.confirmation_consumed, access.account_changed]
  errors:
  - condition: Actor, action, version, payload, expiry, reason, or replay validation fails.
    event: access.identity_rejected
    handling: Roll back the transaction and require a new preview without disclosing target existence.
- id: role_filtered_deep_link
  owner: thesis_trace_application
  description: Resolve responsive direct routes with server role filtering and indistinguishable unavailable-resource behavior.
  trigger: {kind: condition, ref: authenticated_deep_link_requested, description: An authenticated browser opens or restores a profile, account, company tab, or record deep link.}
  steps:
  - {id: role_filtered_deep_link.session, order: 1, module: access_domain, action: Revalidate session and derive current role and capability set., receives: [access.bootstrap_session], emits: [], state_changes: [], side_effects: [Bind transaction-local RLS security context.]}
  - {id: role_filtered_deep_link.project, order: 2, module: thesis_trace_application, action: Query only the exact role-safe projection and current record version., receives: [access.security_context], emits: [], state_changes: [], side_effects: [Owner-only fields are omitted from Learner and Admin payloads.]}
  - {id: role_filtered_deep_link.present, order: 3, module: thesis_trace_application, action: Preserve route identity across reload back forward and responsive navigation or render uniform unavailable resource., receives: [], emits: [], state_changes: [], side_effects: [React route renders no stale cached protected content.]}
  success:
    result: The browser renders the authorized projection while retaining route identity across responsive navigation.
    events: []
  errors:
  - condition: The session, role, record, or requested field is unavailable or unauthorized.
    event: access.identity_rejected
    handling: Clear protected client state and render the same unavailable-resource response for absent and forbidden records.
- id: access_session_revocation
  owner: thesis_trace_application
  description: Revalidate and revoke one application session without extending the Cloudflare Access credential.
  trigger: {kind: command, ref: access.revoke_session, description: An authenticated user logs out or an identity or recovery policy invalidates a session.}
  steps:
  - {id: access_session_revocation.revoke, order: 1, module: access_domain, action: Validate session ownership and atomically record revocation., receives: [access.revoke_session], emits: [access.session_revoked], state_changes: [The application session becomes unusable.], side_effects: [Persist revocation and immutable audit metadata.]}
  - {id: access_session_revocation.present, order: 2, module: thesis_trace_application, action: Clear the opaque browser cookie and protected volatile state., receives: [access.session_revoked], emits: [], state_changes: [], side_effects: [Return the bounded logout response.]}
  success:
    result: The revoked session cannot authorize another application request.
    events: [access.session_revoked]
  errors:
  - condition: The session is absent, already invalid, or belongs to another actor.
    event: access.identity_rejected
    handling: Return the uniform unavailable response without disclosing session existence.
- id: owner_evidence_intake
  owner: thesis_trace_application
  description: Admit an Owner Evidence URL and expose durable lifecycle state.
  trigger:
    kind: command
    ref: application.submit_evidence
    description: An authenticated Owner submits a company and Evidence URL.
  steps:
  - id: owner_evidence_intake.authorize
    order: 1
    module: access_domain
    action: Verify the semantic actor and Owner permission.
    receives:
    - application.submit_evidence
    emits:
    - access.owner_authorized
    state_changes: []
    side_effects: []
  - id: owner_evidence_intake.map
    order: 2
    module: thesis_trace_application
    action: Map the authorized request into a Research command.
    receives:
    - access.owner_authorized
    emits: []
    state_changes: []
    side_effects: []
  - id: owner_evidence_intake.commit
    order: 3
    module: research_domain
    action: Validate and atomically commit received evidence
    audit: null
    and collection job.: null
    receives:
    - research.submit_evidence
    emits:
    - research.evidence_received
    state_changes:
    - Evidence status becomes received at a new server version.
    side_effects:
    - PostgreSQL transaction writes evidence
    - audit
    - and job.
  - id: owner_evidence_intake.collect
    order: 4
    module: research_domain
    action: Lease the durable job and fetch the restricted source.
    receives:
    - research.evidence_received
    emits:
    - research.collection_succeeded
    - research.collection_failed
    state_changes:
    - Evidence becomes processing then succeeded
    - failed
    - retrying
    - or dead-letter.
    side_effects:
    - Bounded HTTPS fetch and PostgreSQL transaction.
  - id: owner_evidence_intake.query
    order: 5
    module: thesis_trace_application
    action: Return the current server-owned record and version to the UI.
    receives:
    - research.query_evidence
    emits:
    - application.evidence_submission_completed
    state_changes: []
    side_effects: []
  success:
    result: UI observes a succeeded immutable source snapshot by record and version.
    events:
    - research.evidence_received
    - research.collection_succeeded
    - application.evidence_submission_completed
  errors:
  - condition: Identity or admission fails before acceptance.
    events: []
    event: application.evidence_submission_completed
    handling: Return a stable non-disclosing error without creating state.
  - condition: Collection fails after acceptance.
    failed: null
    or dead-letter and expose safe status.: null
    events:
    - research.collection_failed
    event: research.collection_failed
    handling: Commit retrying
adr_exceptions: []
