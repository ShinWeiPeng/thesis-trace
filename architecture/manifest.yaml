  ast:
    status: not-applicable
    rationale: ThesisTrace has no governed C or C++ production source.
  functional_boundary:
    status: configured
    rationale: Python and TypeScript boundaries are governed by module contracts and
      their analyzers.
    forbidden_includes: []
    forbidden_symbols: []
  forbidden_public_includes: []
  forbidden_public_symbols: []
  forbidden_source_symbols: []
python_analyzer:
  status: required
  rationale: FastAPI and worker production sources are governed Python modules.
