  exclude: []
  purpose: Govern maintained contract and architecture tooling.
  provenance: Human-maintained repository tooling source.
- id: generated-contracts
  classification: generated-production
  include:
  - backend/src/generated/**
  - frontend/src/generated/**
  exclude: []
  purpose: Contain generator-owned OpenAPI contracts and clients.
  provenance: Generated from the versioned OpenAPI contract.
  generator: project OpenAPI generation pipeline
  owner: contract_generation_adapter
- id: development
  classification: development
  include:
  - tests/**
  - backend/tests/**
  - frontend/tests/**
  - .github/**
  exclude: []
  purpose: Keep tests and development automation outside formal production catalogs.
  provenance: Developer-maintained test and CI source.
- id: derived-docs
  classification: derived-documentation
  include:
  - architecture/generated/**
  exclude: []
  purpose: Contain renderer-owned architecture views.
  provenance: Architecture renderer.
- id: build-output
  classification: build-output
  include:
  - backend/.venv/**
  - frontend/node_modules/**
  - frontend/dist/**
  - build/**
  - coverage/**
  exclude: []
  purpose: Exclude dependencies, build output, and coverage artifacts.
  provenance: Language toolchains and build pipeline.
modules:
- id: thesis_trace_application
  level: L0
  role: orchestration
  implementation_status: planned
  paths:
