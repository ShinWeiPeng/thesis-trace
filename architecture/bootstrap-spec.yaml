  profile: linux_server_functional
  from_unit: api_process
  to_unit: collector_worker_process
  kind: queue
  contract_refs:
  - research.collection_jobs
  - research.evidence_received
  capacity: 1000
  ordering: serialized per Evidence stream
  copy_policy: persist semantic payload once and map on claim
  timeout_ms: 300000
  overload: backpressure
data_access_profiles: []
microarchitecture_profiles: []
platform_variants:
- id: linux_server_functional_variant
  profile: linux_server_functional
  units:
  - api_process
  - collector_worker_process
  - ai_worker_process
  - email_worker_process
  data_access_profiles: []
  microarchitecture_profiles: []
  parameters:
    deployment: Docker Compose on local VM
  release: false
realtime_scheduling_studies: []
composition_roots:
- id: thesis_trace_release
  module: backend_composition
  path: backend/src/thesis_trace/bootstrap/application.py
  symbol: compose_application
  purpose: Compose version-matched API and worker roles with concrete adapters.
  source_set: backend-production
  kind: release
validation_profiles:
- id: host_development_validation
  applicability: not-applicable
  rationale: Wave 0 design and host tests do not claim final target-runtime acceptance.
adoption:
  schema_version: 2.2.0
  project_stage: new
  applicable_analyzers:
  - python
  runtime_validation:
    applicability: not-applicable
    rationale: Wave 0 does not claim final runtime acceptance.
  tool_host_evidence:
    operating_systems:
    - linux
    python_versions:
    - '3.11'
    - '3.12'
    - '3.13'
