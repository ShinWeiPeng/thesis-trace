  - portfolio_domain
  - recommendation_domain
  - workflow_domain
  - notification_domain
  implements_ports: []
  public_headers:
  - backend/src/thesis_trace/application/contracts.py
  description:
    purpose: Coordinate authenticated cross-domain product flows without owning domain
      state.
    diagram_summaries:
      zh-TW: 協調跨領域產品流程
    input_ports:
    - application.submit_evidence
    output_ports:
    - application.events
    emitted_events:
    - application.evidence_submission_completed
    owned_state: []
    side_effects:
    - description: Coordinate child commands and map child events.
    errors:
    - id: thesis_trace_application-error-1
      condition: Reject unauthenticated or unauthorized commands
      event: application.evidence_submission_completed
      handling: Reject unauthenticated or unauthorized commands
    - id: thesis_trace_application-error-2
      condition: Propagate child admission failures.
      event: application.evidence_submission_completed
      handling: Propagate child admission failures.
    invariants:
    - Sibling domains communicate only through this parent
    - Domain state remains child-owned.
