        label: 已核准批次請求
        description: 一個唯一執行識別碼提出最多八次追蹤的測試請求。
        type: event_sequence
        events: [batch_requested]
      - id: coverage-cleanup
        label: 八項診斷覆蓋與清理
        description: 八次解析或故障結果符合預期，原生紀錄可匯出且無遺失標記，恢復程序重新綁定，最後回收本次容器與追蹤程序；不包含資源門檻。
        type: event_sequence
        events: [case_1_covered, case_2_covered, case_3_covered, case_4_covered, case_5_covered, case_6_covered, case_7_covered, case_8_covered, diagnostics_covered, cleanup_confirmed]
