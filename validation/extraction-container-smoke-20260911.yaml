    executable: python3
    args: [backend/tests/prototypes/container_native_smoke.py, run, --output, .codex/evidence/on-device/container-native-smoke-20260911-a1, --library, /tmp/thesis-trace-extraction-prototype.H66cBJ/venv/lib/python3.14/site-packages]
