    evidence_mode: flow
    max_duration_ms: 300000
    prerequisites: []
    actions: [container-native-batch]
    cleanup_actions: [container-cleanup-check]
    architecture_refs: [linux_server_functional, evidence_collection]
    completion:
      trigger_criteria: [requested]
      required_criteria: [coverage-cleanup]
      session_end_reason: complete
    criteria:
